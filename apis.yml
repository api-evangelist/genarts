name: GenArts
description: GenArts, Inc. was a Cambridge, Massachusetts developer of visual effects
  software for the film, broadcast, and advertising industries, best known for its
  flagship Sapphire plug-in suite used in Oscar-nominated visual effects work since
  1996. GenArts was acquired by Boris FX in September 2016; the genarts.com domain
  now redirects to borisfx.com and the Sapphire product line is developed and sold
  under the Boris FX brand. The company published no public developer API, SDK, or
  documented programmatic surface — its products are desktop editing plug-ins. This
  profile is retained in the API Evangelist network as an acquired-company lead.
